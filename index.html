<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>School Dismissal Queue</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#14181f;--mut:#667085;--ac:#1d6fe0;--acx:#fff;--bd:#e1e5eb;--wr:#b91c1c;--hi:#e8f1fe;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1216;--card:#191d24;--tx:#eef0f3;--mut:#9aa3b0;--ac:#5b9dff;--acx:#0b1220;--bd:#2a303a;--wr:#f87171;--hi:#17263d}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:18px;margin:4px 0 12px}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;padding:10px 4px;border:0;border-radius:9px;background:transparent;color:var(--mut);font-size:14px;font-weight:600}
.tabs button.on{background:var(--ac);color:var(--acx)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font-size:32px;letter-spacing:6px;text-align:center;padding:10px;border:2px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx)}
input:focus{outline:none;border-color:var(--ac)}
.btn{border:0;border-radius:12px;padding:0 20px;background:var(--ac);color:var(--acx);font-size:16px;font-weight:700}
.btn.sec{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.btn.dng{background:var(--wr);color:var(--acx)}
.msg{min-height:20px;margin:8px 2px 0;font-size:14px;color:var(--wr)}
.hd{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;margin:0 2px 8px}
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
li button,li div{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:28px;font-weight:700;text-align:left}
li.first button,li.first div{background:var(--hi);border-color:var(--ac)}
li .i{font-size:14px;color:var(--mut);font-weight:600;min-width:22px}
li .tag{margin-left:auto;font-size:12px;color:var(--ac);font-weight:700}
.view li div{font-size:56px;justify-content:center;padding:16px}
.empty{text-align:center;color:var(--mut);padding:28px 0}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;padding:12px}
.sheet.on{display:flex}
.sheet .box{background:var(--card);border-radius:16px;padding:18px;width:100%;max-width:520px;display:flex;flex-direction:column;gap:10px}
.sheet .box button{padding:14px;font-size:16px}
.sheet .box input{font-size:22px;letter-spacing:2px}
.big{font-size:40px;font-weight:800;text-align:center}
.off{padding:20px;text-align:center;color:var(--wr)}
</style>
</head>
<body>
<main>
<h1>🚌 School Dismissal Queue</h1>
<div class="tabs" id="tabs">
  <button data-r="giris">Enter</button>
  <button data-r="guncelle">Update</button>
  <button data-r="izle">View</button>
</div>
<div id="off" class="off" hidden>Not connected. Check the internet connection or the setup below.</div>
<div id="entry" class="card" hidden>
  <div class="row">
    <input id="num" inputmode="numeric" pattern="[0-9]*" maxlength="3" placeholder="000" autocomplete="off">
    <button class="btn" id="add">Add</button>
  </div>
  <div class="msg" id="msg"></div>
</div>
<div class="hd"><span id="hint"></span><span id="count"></span></div>
<ol id="list"></ol>
</main>

<div class="sheet" id="sheet"><div class="box">
  <div class="big" id="sn"></div>
  <button class="btn" id="upto">Boarded — remove this and earlier</button>
  <button class="btn dng" id="one">Remove only this one</button>
  <button class="btn sec" id="cancel">Cancel</button>
</div></div>

<div class="sheet" id="pinSheet"><div class="box">
  <div>Enter the staff PIN for this device</div>
  <input id="pinInput" inputmode="numeric" placeholder="PIN">
  <div class="msg" id="pinMsg"></div>
  <button class="btn" id="pinOk">Unlock</button>
  <button class="btn sec" id="pinCancel">Cancel</button>
</div></div>

<!-- ====== 1) Paste your own Firebase project's config here ====== -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBcgmcgtWhFsAiuQ7B_9YOYmD1WDAwNLeU",
  authDomain: "carpool-1b4f4.firebaseapp.com",
  projectId: "carpool-1b4f4",
  storageBucket: "carpool-1b4f4.firebasestorage.app",
  messagingSenderId: "696301643791",
  appId: "1:696301643791:web:21527c9f110f9b83d69b7a"
};
// ====== 2) Set a PIN that Enter/Update staff must type once per device ======
const PIN = "1453";
</script>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var col=null, items=[], role='izle', sel=-1, pendingRole=null;
  try{var r=localStorage.getItem('role'); if(r==='giris'||r==='guncelle'||r==='izle') role=r;}catch(e){}

  function unlocked(){ try{return localStorage.getItem('pin_ok')==='yes'}catch(e){return false} }

  function setRole(r){
    if((r==='giris'||r==='guncelle') && !unlocked()){ pendingRole=r; $('pinInput').value=''; $('pinMsg').textContent=''; $('pinSheet').classList.add('on'); return; }
    role=r; try{localStorage.setItem('role',r)}catch(e){} render();
  }
  document.querySelectorAll('#tabs button').forEach(function(b){b.onclick=function(){setRole(b.dataset.r)}});

  $('pinOk').onclick=function(){
    if($('pinInput').value===PIN){ try{localStorage.setItem('pin_ok','yes')}catch(e){} $('pinSheet').classList.remove('on'); role=pendingRole; try{localStorage.setItem('role',role)}catch(e){} render(); }
    else{ $('pinMsg').textContent='Wrong PIN.'; }
  };
  $('pinCancel').onclick=function(){ $('pinSheet').classList.remove('on'); };

  function render(){
    document.querySelectorAll('#tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.r===role)});
    $('entry').hidden = role!=='giris' || !col;
    $('off').hidden = !!col;
    $('hint').textContent = role==='giris' ? 'Vehicles in line' : role==='guncelle' ? 'Tap the vehicle that boarded' : 'Up next';
    $('count').textContent = items.length ? items.length+(items.length===1?' vehicle':' vehicles') : '';
    var ol=$('list'); ol.textContent=''; ol.className = role==='izle' ? 'view' : '';
    if(!items.length){var e=document.createElement('div');e.className='empty';e.textContent='No vehicles in line';ol.appendChild(e);return;}
    items.forEach(function(it,idx){
      var li=document.createElement('li'); if(idx===0) li.className='first';
      var el=document.createElement(role==='guncelle'?'button':'div');
      if(role!=='izle'){var i=document.createElement('span');i.className='i';i.textContent=idx+1;el.appendChild(i);}
      var n=document.createElement('span');n.textContent=it.num;el.appendChild(n);
      if(idx===0 && role!=='izle'){var t=document.createElement('span');t.className='tag';t.textContent='NEXT';el.appendChild(t);}
      if(role==='guncelle') el.onclick=function(){openSheet(idx)};
      li.appendChild(el); ol.appendChild(li);
    });
  }

  function openSheet(idx){
    sel=idx; $('sn').textContent=items[idx].num;
    $('upto').textContent = idx===0 ? 'Boarded — remove' : 'Boarded — remove this and '+idx+' earlier '+(idx===1?'vehicle':'vehicles');
    $('sheet').classList.add('on');
  }
  function closeSheet(){$('sheet').classList.remove('on'); sel=-1;}
  $('cancel').onclick=closeSheet;
  $('sheet').onclick=function(e){if(e.target===$('sheet'))closeSheet();};

  async function del(list){
    closeSheet();
    try{ await Promise.all(list.map(function(it){return col.doc(it.id).delete()})); }
    catch(e){ alert('Could not remove. Please try again.'); }
  }
  $('upto').onclick=function(){ if(sel>=0) del(items.slice(0,sel+1)); };
  $('one').onclick=function(){ if(sel>=0) del([items[sel]]); };

  var busy=false;
  async function add(){
    if(busy||!col) return;
    var v=$('num').value.trim(), m=$('msg'); m.textContent='';
    if(!/^\d{3}$/.test(v)){m.textContent='Enter a 3-digit number.';return;}
    if(items.some(function(i){return i.num===v})){m.textContent=v+' is already in the queue.';return;}
    busy=true;
    try{ await col.add({num:v, ts:Date.now()}); $('num').value=''; }
    catch(e){ m.textContent='Could not add. Please try again.'; }
    busy=false;
    setTimeout(function(){ $('num').focus(); }, 0);
  }
  $('add').onclick=function(){add();};
  $('num').onkeydown=function(e){if(e.key==='Enter')add();};
  $('num').oninput=function(){this.value=this.value.replace(/\D/g,'').slice(0,3); $('msg').textContent='';};

  render();
  try{
    firebase.initializeApp(firebaseConfig);
    col=firebase.firestore().collection('queue');
    col.orderBy('ts','asc').onSnapshot(function(snap){
      items=snap.docs.map(function(d){var x=d.data();return {id:d.id,num:String(x.num),ts:x.ts}});
      render();
    },function(){col=null;render();});
    render();
  }catch(e){col=null;render();}
})();
</script>
</body>
</html>
